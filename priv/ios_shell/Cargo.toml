# ex_tauri's own iOS plugin: what every ExTauri app on iPhone and iPad gets,
# registered by `mix ex_tauri.ios init` from the ex_tauri dependency (never copied
# into the app). Configured with `config :ex_tauri, :ios` (see ExTauri.Ios).
[package]
name = "tauri-plugin-ex-tauri"
version = "0.1.0"
edition = "2021"
publish = false
links = "tauri-plugin-ex-tauri"

[dependencies]
tauri = "2"
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
