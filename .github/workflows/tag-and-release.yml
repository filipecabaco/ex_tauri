name: Tag and Release

# When @version in mix.exs changes on main, create and push the matching
# vX.Y.Z tag, then start release.yml for it, which publishes to hex.pm.
#
# Release flow: bump @version in mix.exs -> merge to main -> tag is created
# here -> release.yml publishes to Hex and cuts a GitHub Release.
#
# The release has to be started explicitly. A tag pushed with GITHUB_TOKEN
# triggers no workflows (GitHub's guard against recursive runs), so the tag
# push alone never reached release.yml; v0.3.0 sat tagged and unpublished.
# workflow_dispatch is the one event GITHUB_TOKEN is allowed to trigger.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from mix.exs
        run: |
          VERSION=$(grep -m 1 '@version' mix.exs | sed 's/.*"\([0-9.]*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Start the Hex release
        if: steps.check_tag.outputs.exists == 'false'
        run: gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f tag="v$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
